services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "3456:3456"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - config-data:/app/data
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - HOST_ADDRESS=${HOST_ADDRESS:-localhost}

volumes:
  config-data:
